<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big Bang em Realidade Virtual</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#03040f;overflow:hidden;font-family:'Baloo 2',system-ui,sans-serif;color:#f4f1ff}
  canvas{display:block;touch-action:none}
  #ui{position:fixed;left:0;right:0;bottom:0;padding:12px 14px 16px;background:linear-gradient(transparent,rgba(3,4,15,.92) 35%);display:flex;flex-direction:column;gap:8px;align-items:center}
  #hint{font-size:15px;color:#b9b4e6;text-align:center;max-width:620px}
  .row{display:flex;gap:10px;width:100%;max-width:520px}
  .btn{flex:1;font:inherit;font-weight:800;font-size:18px;padding:11px;border-radius:14px;border:0;cursor:pointer;background:#ffcf5a;color:#1a1440}
  .btn.ghost{background:#1c2150;color:#f4f1ff}
  .btn.fly{background:#7fd3ff;flex:2}
  .btn.sm{flex:0 0 52px;padding:11px 0}
  #hint{line-height:1.3}
  #VRButton{position:static!important;transform:none!important;width:100%!important;max-width:520px;font:800 18px 'Baloo 2',system-ui!important;border-radius:14px!important;padding:11px!important;background:#ff7ab6!important;color:#1a1440!important;border:0!important;opacity:1!important}
  #vrslot{width:100%;display:flex;justify-content:center}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="ui">
  <div id="vrslot"></div>
  <div class="row"><button class="btn ghost" id="prev">◀ Voltar</button><button class="btn" id="next">Próximo ▶</button></div>
  <div class="row"><button class="btn fly" id="go">🚀 Chegar perto</button><button class="btn ghost sm" id="zin">➕</button><button class="btn ghost sm" id="zout">➖</button><button class="btn ghost sm" id="home">⟲</button><button class="btn ghost sm" id="snd">🔊</button></div>
  <div id="hint"><b>Arraste</b> para olhar · <b>roda do mouse</b>, <b>W/S</b> ou <b>↑/↓</b> para ir para frente e para trás · <b>A/D</b> para os lados · <b>Q/E</b> sobe/desce · <b>N/B</b> troca de parte.<br>Toque na tela para ligar o <b>narrador</b> 🔊.<br>No óculos: <b>gatilho</b> avança, <b>grip</b> volta, <b>analógico esquerdo</b> voa, <b>analógico direito</b> gira e sobe/desce, botão <b>A</b> chega perto.</div>
</div>
<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';

const STAGES = [
  ["No começo… um pontinho!", "Há 13,8 bilhões de anos, TUDO estava apertado nesse pontinho minúsculo e superquente. Aperte o gatilho! ▶"],
  ["Ele começou a crescer! 🎈", "O espaço foi se esticando como um balão enchendo… e agora você está DENTRO dele! Olhe em volta!"],
  ["Esfriando… ❄️", "Crescendo, o universo foi esfriando (veja a cor mudar). As pecinhas se juntaram e formaram os átomos."],
  ["Nascem as estrelas ⭐", "Milhões de anos depois, nuvens de gás se juntaram e acenderam: as primeiras estrelas!"],
  ["Viram galáxias 🌀", "As estrelas se juntaram em grupos gigantes que giram: as galáxias! Procure-as em volta de você."],
  ["Nasce o Sol e a Terra ☀️🌍", "Há 4,6 bilhões de anos nasceram o Sol e a Terra, que gira em volta dele com a Lua."],
  ["Você está aqui! 📍", "E o universo continua crescendo até hoje — as galáxias ainda estão se afastando!"],
  ["E o que tinha ANTES? 🤔", "Ninguém sabe! Uma ideia: dois universos gigantes, como folhas, se encostaram… e BUM! Quem sabe você descobre? 🔭"],
];

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
document.body.prepend(renderer.domElement);
document.getElementById('vrslot').appendChild(VRButton.createButton(renderer));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x03040f);
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.02, 500);
camera.position.set(0,1.6,0);
// the "rig" is the player: moving it moves the viewer (works in VR too)
const rig = new THREE.Group(); rig.add(camera); scene.add(rig);
scene.add(new THREE.AmbientLight(0xffffff,0.25));

addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

// drag to look (desktop/phone)
let yaw=0,pitch=0,drag=null;
renderer.domElement.addEventListener('pointerdown',e=>drag={x:e.clientX,y:e.clientY});
addEventListener('pointerup',()=>drag=null);
addEventListener('pointermove',e=>{ if(!drag || pinch) return; yaw-=(e.clientX-drag.x)*.005; pitch-=(e.clientY-drag.y)*.005; pitch=Math.max(-1.5,Math.min(1.5,pitch)); drag={x:e.clientX,y:e.clientY}; });

// free movement: keyboard, wheel, pinch, buttons
const keys=new Set();
addEventListener('keydown',e=>{ keys.add(e.key.toLowerCase()); if(['arrowup','arrowdown',' '].includes(e.key.toLowerCase())) e.preventDefault(); });
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
const tmpDir=new THREE.Vector3(), tmpRight=new THREE.Vector3(), UP=new THREE.Vector3(0,1,0);
function viewDir(){ camera.getWorldDirection(tmpDir); return tmpDir; }
function moveBy(f,r,u){
  flight=null;
  const d=viewDir().clone(); tmpRight.crossVectors(d,UP).normalize();
  rig.position.addScaledVector(d,f).addScaledVector(tmpRight,r).addScaledVector(UP,u);
}
renderer.domElement.addEventListener('wheel',e=>{ e.preventDefault(); moveBy(-e.deltaY*0.004,0,0); },{passive:false});
let pinch=null;
renderer.domElement.addEventListener('touchstart',e=>{ if(e.touches.length===2){ const [a,b]=e.touches; pinch=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY); } },{passive:true});
renderer.domElement.addEventListener('touchmove',e=>{ if(e.touches.length===2 && pinch){ const [a,b]=e.touches; const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY); moveBy((d-pinch)*0.01,0,0); pinch=d; } },{passive:true});
renderer.domElement.addEventListener('touchend',e=>{ if(e.touches.length<2) pinch=null; },{passive:true});
let holdZ=0;
const hold=(id,v)=>{ const b=document.getElementById(id);
  b.addEventListener('pointerdown',e=>{e.preventDefault(); holdZ=v;}); ['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,()=>holdZ=0)); };
hold('zin',1); hold('zout',-1);

// smooth "fly to" animation
let flight=null;
function flyTo(target, dist){
  const camW=new THREE.Vector3(); camera.getWorldPosition(camW);
  let off=camW.clone().sub(target); if(off.lengthSq()<1e-6) off.set(0,0,1);
  const dest=target.clone().add(off.normalize().multiplyScalar(dist));
  flight={from:rig.position.clone(), to:rig.position.clone().add(dest.sub(camW)), t:0, look:target.clone()};
}
function goHome(){ flight={from:rig.position.clone(), to:new THREE.Vector3(), t:0, look:null, home:true}; }

// ---------- helpers ----------
function glowTex(inner='rgba(255,250,230,1)', mid='rgba(255,200,120,.5)'){
  const c=document.createElement('canvas'); c.width=c.height=128; const g=c.getContext('2d');
  const gr=g.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,inner); gr.addColorStop(.3,mid); gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr; g.fillRect(0,0,128,128); return new THREE.CanvasTexture(c);
}
const dotTex = glowTex('rgba(255,255,255,1)','rgba(255,255,255,.35)');
function glowSprite(color, size){
  const m=new THREE.SpriteMaterial({map:glowTex(), color, blending:THREE.AdditiveBlending, transparent:true, depthWrite:false});
  const s=new THREE.Sprite(m); s.scale.setScalar(size); return s;
}
function textSprite(txt, color='#ffcf5a', w=1.2){
  const c=document.createElement('canvas'); c.width=512; c.height=128; const g=c.getContext('2d');
  g.font='800 64px "Baloo 2", system-ui, sans-serif'; g.textAlign='center'; g.textBaseline='middle';
  g.lineWidth=10; g.strokeStyle='rgba(3,4,15,.85)'; g.strokeText(txt,256,64); g.fillStyle=color; g.fillText(txt,256,64);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c), transparent:true, depthWrite:false}));
  s.scale.set(w,w/4,1); return s;
}

// ---------- text panel ----------
const panelCanvas=document.createElement('canvas'); panelCanvas.width=1024; panelCanvas.height=420;
const panelTex=new THREE.CanvasTexture(panelCanvas);
const panel=new THREE.Mesh(new THREE.PlaneGeometry(1.4,1.4*420/1024), new THREE.MeshBasicMaterial({map:panelTex, transparent:true, depthWrite:false}));
panel.position.set(0,1.05,-1.5); panel.rotation.x=-0.25; panel.renderOrder=10;
rig.add(panel); // the text travels with the viewer
function wrap(g,text,x,y,maxW,lh){
  const words=text.split(' '); let line='';
  for(const w of words){ const t=line?line+' '+w:w; if(g.measureText(t).width>maxW){ g.fillText(line,x,y); y+=lh; line=w; } else line=t; }
  g.fillText(line,x,y);
}
function drawPanel(i){
  const g=panelCanvas.getContext('2d'); const [t,b]=STAGES[i];
  g.clearRect(0,0,1024,420);
  g.fillStyle='rgba(12,14,45,.86)'; g.beginPath(); g.roundRect(8,8,1008,404,40); g.fill();
  g.strokeStyle='rgba(255,122,182,.8)'; g.lineWidth=5; g.stroke();
  g.fillStyle='#ff7ab6'; g.font='800 34px "Baloo 2", system-ui'; g.textAlign='left'; g.textBaseline='top';
  g.fillText(`PARTE ${i+1} DE ${STAGES.length}`,50,36);
  g.fillStyle='#ffcf5a'; g.font='800 60px "Baloo 2", system-ui'; g.fillText(t,50,78);
  g.fillStyle='#eae6ff'; g.font='600 40px "Baloo 2", system-ui'; wrap(g,b,50,170,924,52);
  panelTex.needsUpdate=true;
}

// ---------- objects ----------
const ORIGIN=new THREE.Vector3(0,1.6,-4);

// 0: the tiny hot point
const seed=glowSprite(0xfff0c8,0.6); seed.position.copy(ORIGIN); scene.add(seed);
const flash=glowSprite(0xffffff,1); flash.position.copy(ORIGIN); flash.material.opacity=0; scene.add(flash);

// 1-3: expanding cloud
const N=5000, dirs=new Float32Array(N*3), pos=new Float32Array(N*3);
for(let i=0;i<N;i++){
  const v=new THREE.Vector3().randomDirection().multiplyScalar(Math.cbrt(Math.random()));
  dirs.set([v.x,v.y,v.z],i*3);
}
const cloudGeo=new THREE.BufferGeometry(); cloudGeo.setAttribute('position',new THREE.BufferAttribute(pos,3));
const cloudMat=new THREE.PointsMaterial({size:0.12, map:dotTex, color:0xfff2c0, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, opacity:1});
const cloud=new THREE.Points(cloudGeo,cloudMat); scene.add(cloud);
function setCloud(R){
  for(let i=0;i<N;i++){ pos[i*3]=ORIGIN.x+dirs[i*3]*R; pos[i*3+1]=ORIGIN.y+dirs[i*3+1]*R; pos[i*3+2]=ORIGIN.z+dirs[i*3+2]*R; }
  cloudGeo.attributes.position.needsUpdate=true;
}

// atoms (stage 2)
const atoms=new THREE.Group(); scene.add(atoms);
for(let i=0;i<14;i++){
  const a=new THREE.Group();
  const nuc=new THREE.Mesh(new THREE.SphereGeometry(0.06,16,16), new THREE.MeshBasicMaterial({color:0xff7ab6}));
  const ring=new THREE.Mesh(new THREE.TorusGeometry(0.2,0.006,8,48), new THREE.MeshBasicMaterial({color:0x9fc3ff}));
  ring.rotation.x=Math.random()*3; const ring2=ring.clone(); ring2.rotation.y=1.6;
  const el=new THREE.Mesh(new THREE.SphereGeometry(0.03,8,8), new THREE.MeshBasicMaterial({color:0x9fc3ff}));
  a.add(nuc,ring,ring2,el); a.userData={el,ring,ph:Math.random()*6};
  const ang=i/14*Math.PI*2; a.position.set(Math.sin(ang)*(2+Math.random()*2), 1.0+Math.random()*1.6, -Math.cos(ang)*(2+Math.random()*2));
  atoms.add(a);
}

// 3+: starfield
const SN=3000, sp=new Float32Array(SN*3);
for(let i=0;i<SN;i++){ const v=new THREE.Vector3().randomDirection().multiplyScalar(60+Math.random()*80); sp.set([v.x,v.y+1.6,v.z],i*3); }
const starGeo=new THREE.BufferGeometry(); starGeo.setAttribute('position',new THREE.BufferAttribute(sp,3));
const starMat=new THREE.PointsMaterial({size:0.9, map:dotTex, color:0xffffff, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false});
const stars=new THREE.Points(starGeo,starMat); scene.add(stars);

// stage 3: a gas cloud collapsing into a star
const GN=600, gdir=new Float32Array(GN*3), gpos=new Float32Array(GN*3);
for(let i=0;i<GN;i++){ const v=new THREE.Vector3().randomDirection().multiplyScalar(0.3+Math.random()); gdir.set([v.x,v.y,v.z],i*3); }
const gasGeo=new THREE.BufferGeometry(); gasGeo.setAttribute('position',new THREE.BufferAttribute(gpos,3));
const gasMat=new THREE.PointsMaterial({size:0.1,map:dotTex,color:0xb4a0ff,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false});
const gas=new THREE.Points(gasGeo,gasMat); scene.add(gas);
const newStar=glowSprite(0xffffdc,2); newStar.position.copy(ORIGIN); scene.add(newStar);

// 4+: galaxies
function makeGalaxy(hue, size){
  const n=2500, p=new Float32Array(n*3), c=new Float32Array(n*3), col=new THREE.Color();
  for(let i=0;i<n;i++){
    const arm=i%3, k=Math.pow(Math.random(),0.7), ang=arm*2.09+k*5.5+(Math.random()-.5)*.5, r=k*size;
    p.set([Math.cos(ang)*r+(Math.random()-.5)*.3, (Math.random()-.5)*.25*(1-k), Math.sin(ang)*r+(Math.random()-.5)*.3],i*3);
    col.setHSL(hue,0.8,0.9-k*0.4); c.set([col.r,col.g,col.b],i*3);
  }
  const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.BufferAttribute(p,3)); geo.setAttribute('color',new THREE.BufferAttribute(c,3));
  const g=new THREE.Group();
  g.add(new THREE.Points(geo,new THREE.PointsMaterial({size:0.18,map:dotTex,vertexColors:true,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false})));
  const core=glowSprite(new THREE.Color().setHSL(hue,0.9,0.8),size*0.9); g.add(core);
  return g;
}
const galaxies=new THREE.Group(); scene.add(galaxies);
[[0,12,.12,4,'Via Láctea'],[1.2,16,.6,3],[2.4,14,.85,3.5],[3.6,18,.0,3],[4.8,15,.75,3.2]].forEach(([a,d,h,s,name],i)=>{
  const g=makeGalaxy(h,s); g.position.set(Math.sin(a)*d, 1.6+(i%2?3:-1.5), -Math.cos(a)*d);
  g.rotation.set(0.6+i*.3,0,0.3*i); g.userData.spin=(i%2?1:-1)*0.15; galaxies.add(g);
  if(name){ const t=textSprite(name,'#ffcf5a',3); t.position.copy(g.position).add(new THREE.Vector3(0,s*.6+1,0)); galaxies.add(t); }
});

// 5-6: sun, earth, moon
const solar=new THREE.Group(); scene.add(solar);
const SUN=new THREE.Vector3(0,1.6,-3.5);
const sunMesh=new THREE.Mesh(new THREE.SphereGeometry(0.35,32,32), new THREE.MeshBasicMaterial({color:0xffd34d}));
sunMesh.position.copy(SUN); solar.add(sunMesh);
const sunGlow=glowSprite(0xffb43c,2.6); sunGlow.position.copy(SUN); solar.add(sunGlow);
const sunLight=new THREE.PointLight(0xfff0d0,30,0,1.5); sunLight.position.copy(SUN); solar.add(sunLight);
const sunLabel=textSprite('Sol','#ffcf5a',0.8); sunLabel.position.copy(SUN).add(new THREE.Vector3(0,0.6,0)); solar.add(sunLabel);
function earthTex(){
  const c=document.createElement('canvas'); c.width=512; c.height=256; const g=c.getContext('2d');
  g.fillStyle='#1f63c6'; g.fillRect(0,0,512,256); g.fillStyle='#46b862';
  [[90,90,60,40],[150,170,40,55],[270,80,70,45],[300,150,35,50],[420,110,55,35],[450,190,30,20]].forEach(([x,y,w,h])=>{g.beginPath();g.ellipse(x,y,w,h,.4,0,7);g.fill();});
  g.fillStyle='#ffffff'; g.fillRect(0,0,512,14); g.fillRect(0,242,512,14);
  return new THREE.CanvasTexture(c);
}
const earth=new THREE.Mesh(new THREE.SphereGeometry(0.12,48,48), new THREE.MeshStandardMaterial({map:earthTex(), roughness:.8}));
solar.add(earth);
const moon=new THREE.Mesh(new THREE.SphereGeometry(0.035,16,16), new THREE.MeshStandardMaterial({color:0xdddddd}));
solar.add(moon);
const earthLabel=textSprite('Terra','#7fd3ff',0.6); solar.add(earthLabel);
const youLabel=textSprite('📍 você!','#ff7ab6',1.0); solar.add(youLabel);

// 7: two "membrane" universes colliding
const branes=new THREE.Group(); scene.add(branes);
function brane(color){ const geo=new THREE.PlaneGeometry(4,4,40,40); const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color,wireframe:true,transparent:true,opacity:.7})); m.rotation.y=Math.PI/2; m.userData.base=geo.attributes.position.array.slice(); return m; }
const braneA=brane(0x7fd3ff), braneB=brane(0xff7ab6); branes.add(braneA,braneB);
branes.position.copy(ORIGIN);
const bum=textSprite('💥 BUM!','#ffcf5a',1.6); bum.position.copy(ORIGIN).add(new THREE.Vector3(0,1.6,0)); scene.add(bum);

// ---------- stage logic ----------
let stage=0, stageT=0;
const clock=new THREE.Clock();
function go(n){ const prev=stage; stage=(n+STAGES.length)%STAGES.length; stageT=0; drawPanel(stage); if(prev!==stage){ narrate(stage); fx(stage); } }
document.getElementById('next').onclick=()=>go(stage+1);
document.getElementById('prev').onclick=()=>go(Math.max(0,stage-1));
for(let i=0;i<2;i++){
  const ctrl=renderer.xr.getController(i);
  ctrl.addEventListener('selectstart',()=>go(stage+1));
  ctrl.addEventListener('squeezestart',()=>go(Math.max(0,stage-1)));
  rig.add(ctrl);
}
addEventListener('keydown',e=>{ const k=e.key.toLowerCase();
  if(k==='n'||k==='enter'||k==='pagedown') go(stage+1);
  if(k==='b'||k==='pageup') go(Math.max(0,stage-1));
  if(k==='f') flyToFocus();
  if(k==='h') goHome(); });

// what "Chegar perto" flies to in each part, and how close
function focusOf(s){
  const v=new THREE.Vector3();
  switch(s){
    case 2: atoms.children[0].getWorldPosition(v); return [v,0.7];
    case 4: galaxies.children[0].getWorldPosition(v); return [v,7];
    case 5: return [sunMesh.getWorldPosition(v),1.2];
    case 6: return [earth.getWorldPosition(v),0.7];
    case 7: return [ORIGIN.clone(),3.5];
    case 1: return [ORIGIN.clone(),3];
    default: return [ORIGIN.clone(),1.2];
  }
}
function flyToFocus(){ const [p,d]=focusOf(stage); flyTo(p,d); }
document.getElementById('go').onclick=flyToFocus;
document.getElementById('home').onclick=goHome;
let snapCD=0, aWas=false;

// ---------- narration + cinematic sound ----------
const NARR = [
  "No início... não existia nada do que conhecemos. Apenas um ponto. Minúsculo. Infinitamente quente. E, dentro dele... tudo o que um dia iria existir.",
  "E então... tudo começou. O espaço se expandiu em todas as direções, como um balão gigante. E você... está dentro dele.",
  "O universo cresceu... e esfriou. Pequenas partículas se uniram, formando os primeiros átomos. Os tijolos de tudo o que existe.",
  "Milhões de anos se passaram. A gravidade reuniu nuvens de gás... até que, pela primeira vez... uma estrela se acendeu.",
  "Bilhões de estrelas se uniram em redemoinhos gigantes. Nasciam as galáxias. E entre elas... a nossa. A Via Láctea.",
  "Há quatro bilhões e seiscentos milhões de anos, num canto tranquilo da galáxia... nasceu o Sol. E, ao seu redor... um pequeno planeta azul. A Terra.",
  "E aqui está você. Feita da poeira das estrelas. E o universo... continua crescendo.",
  "Mas... o que existia antes? Ninguém sabe. Talvez dois universos tenham se tocado... Talvez... você descubra a resposta."
];
let AC=null, master=null, soundOn=true, unlocked=false, voice=null;
const MALE=/(male|mascul|daniel|ricardo|ant[oô]nio|felipe|thiago|f[aá]bio|duarte|cristiano|humberto|donato|j[uú]lio|nicolau|val[eé]rio|bruno|paulo|marcos|rafael|eduardo)/i;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs=speechSynthesis.getVoices().filter(v=>/^pt/i.test(v.lang));
  voice = vs.find(v=>/br/i.test(v.lang)&&MALE.test(v.name)) || vs.find(v=>MALE.test(v.name)) || vs.find(v=>/br/i.test(v.lang)) || vs[0] || null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
// recorded narration: if audio/parte1.mp3 ... parte8.mp3 exist next to this page they are used
// (they work everywhere, including the VR headset); otherwise the device voice is used
const clips={}; let clipSrc=null, voiceBus=null;
async function loadClip(i){
  if(i in clips) return clips[i];
  try{ const r=await fetch(`audio/parte${i+1}.mp3`); if(!r.ok) throw 0; clips[i]=await AC.decodeAudioData(await r.arrayBuffer()); }
  catch(e){ clips[i]=null; }
  return clips[i];
}
function stopVoice(){ if(clipSrc){ try{clipSrc.stop();}catch(e){} clipSrc=null; } if('speechSynthesis' in window) speechSynthesis.cancel(); }
async function narrate(i){
  if(!soundOn || !unlocked) return;
  stopVoice();
  const buf = AC ? await loadClip(i) : null;
  if(i!==stage || !soundOn) return;
  if(buf){
    const src=AC.createBufferSource(); src.buffer=buf; src.connect(voiceBus);
    duck(true); src.onended=()=>{ if(clipSrc===src){ clipSrc=null; duck(false);} };
    src.start(AC.currentTime+0.3); clipSrc=src; return;
  }
  if(!('speechSynthesis' in window)) return;
  const u=new SpeechSynthesisUtterance(NARR[i]);
  if(voice) u.voice=voice; u.lang=voice?voice.lang:'pt-BR';
  u.pitch=0.45; u.rate=0.82; u.volume=1;      // deep, slow, movie-trailer style
  duck(true); u.onend=()=>duck(false); u.onerror=()=>duck(false);
  setTimeout(()=>speechSynthesis.speak(u),350);
}
function initAudio(){
  if(AC) return;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain(); master.gain.value=0;
  // big "cinema hall" reverb
  const len=AC.sampleRate*4, ir=AC.createBuffer(2,len,AC.sampleRate);
  for(let c=0;c<2;c++){ const d=ir.getChannelData(c); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3); }
  const rev=AC.createConvolver(); rev.buffer=ir; const wet=AC.createGain(); wet.gain.value=0.55;
  master.connect(AC.destination); master.connect(rev); rev.connect(wet); wet.connect(AC.destination);
  voiceBus=AC.createGain(); voiceBus.gain.value=1.3; voiceBus.connect(AC.destination); voiceBus.connect(rev); // recorded voice gets the cinema echo
  // deep space drone spread left/right around the listener
  const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=380; lp.connect(master);
  [[55,-0.9,.11],[55.35,0.9,.11],[82.4,-0.5,.06],[110.2,0.5,.05],[164.8,0,.03]].forEach(([f,p,v])=>{
    const o=AC.createOscillator(); o.type=f<100?'sawtooth':'triangle'; o.frequency.value=f;
    const g=AC.createGain(); g.gain.value=v; const pn=AC.createStereoPanner(); pn.pan.value=p;
    o.connect(g).connect(pn).connect(lp); o.start(); });
  const lfo=AC.createOscillator(); lfo.frequency.value=0.06; const lg=AC.createGain(); lg.gain.value=220;
  lfo.connect(lg).connect(lp.frequency); lfo.start();
  master.gain.linearRampToValueAtTime(0.5, AC.currentTime+3);
}
function duck(on){ if(!AC) return; const g=master.gain, t=AC.currentTime; g.cancelScheduledValues(t); g.setValueAtTime(g.value,t); g.linearRampToValueAtTime(soundOn?(on?0.2:0.5):0, t+0.6); }
function boom(){
  if(!AC||!soundOn) return; const t=AC.currentTime;
  const o=AC.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(95,t); o.frequency.exponentialRampToValueAtTime(26,t+2.8);
  const g=AC.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(1.0,t+0.04); g.gain.exponentialRampToValueAtTime(0.0001,t+3.2);
  o.connect(g).connect(master); o.start(t); o.stop(t+3.3);
  const b=AC.createBuffer(2,AC.sampleRate*2.5,AC.sampleRate);
  for(let c=0;c<2;c++){ const d=b.getChannelData(c); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2.2); }
  const n=AC.createBufferSource(); n.buffer=b; const nf=AC.createBiquadFilter(); nf.type='lowpass'; nf.frequency.value=700;
  const ng=AC.createGain(); ng.gain.value=0.6; n.connect(nf).connect(ng).connect(master); n.start(t);
}
let boomTimer=null;
function fx(i){ clearTimeout(boomTimer); if(i===1) boom(); if(i===7) boomTimer=setTimeout(boom,2500); }
function unlock(){
  initAudio(); if(AC.state==='suspended') AC.resume();
  if(!unlocked){ unlocked=true; narrate(stage); }
}
addEventListener('pointerdown',unlock); addEventListener('keydown',unlock);
const sndBtn=document.getElementById('snd');
sndBtn.addEventListener('click',()=>{
  soundOn=!soundOn; sndBtn.textContent=soundOn?'🔊':'🔇';
  if(!soundOn){ stopVoice(); duck(false); }
  else { unlock(); duck(false); narrate(stage); }
});


const ease=x=>1-Math.pow(1-Math.min(Math.max(x,0),1),3);
const hot=new THREE.Color(0xfff2c0), warm=new THREE.Color(0xff8a3c), cool=new THREE.Color(0x8fa8ff);
const fade=(obj,on,dt,speed=1.5)=>{ obj.userData.f=THREE.MathUtils.clamp((obj.userData.f??0)+(on?1:-1)*dt*speed,0,1); obj.visible=obj.userData.f>0.001; return obj.userData.f; };

function setOpacity(group,o){ group.traverse(m=>{ if(m.material){ m.material.transparent=true; if(m.material.userData.o===undefined) m.material.userData.o=m.material.opacity; m.material.opacity=m.material.userData.o*o; } }); }

renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),0.05); stageT+=dt; const t=clock.elapsedTime;
  if(!renderer.xr.isPresenting){ camera.rotation.set(pitch,yaw,0,'YXZ'); }

  // ---- free movement ----
  const sp=(keys.has('shift')?6:2.5)*dt;
  let f=0,r=0,u=0;
  if(keys.has('w')||keys.has('arrowup')) f+=sp;
  if(keys.has('s')||keys.has('arrowdown')) f-=sp;
  if(keys.has('d')||keys.has('arrowright')) r+=sp;
  if(keys.has('a')||keys.has('arrowleft')) r-=sp;
  if(keys.has('e')||keys.has(' ')) u+=sp;
  if(keys.has('q')) u-=sp;
  f+=holdZ*2.5*dt;
  // VR thumbsticks
  const ses=renderer.xr.getSession();
  if(ses){ snapCD-=dt;
    for(const src of ses.inputSources){ const gp=src.gamepad; if(!gp) continue;
      const ax=gp.axes.length>=4?[gp.axes[2],gp.axes[3]]:[gp.axes[0]||0,gp.axes[1]||0];
      const dz=v=>Math.abs(v)<0.15?0:v;
      if(src.handedness==='left'){ f+=-dz(ax[1])*3*dt; r+=dz(ax[0])*3*dt; }
      if(src.handedness==='right'){
        u+=-dz(ax[1])*2*dt;
        if(Math.abs(ax[0])>0.7 && snapCD<=0){ // snap turn around the head
          const head=new THREE.Vector3(); camera.getWorldPosition(head);
          const ang=-Math.sign(ax[0])*Math.PI/6;
          rig.position.sub(head).applyAxisAngle(UP,ang).add(head); rig.rotation.y+=ang; snapCD=0.35; }
        const aNow=!!(gp.buttons[4]&&gp.buttons[4].pressed); if(aNow&&!aWas) flyToFocus(); aWas=aNow;
      } } }
  if(f||r||u) moveBy(f,r,u);
  if(flight){ flight.t=Math.min(1,flight.t+dt/1.6); const k=ease(flight.t);
    rig.position.lerpVectors(flight.from,flight.to,k);
    if(!renderer.xr.isPresenting){
      if(flight.look){ const c=new THREE.Vector3(); camera.getWorldPosition(c); const v=flight.look.clone().sub(c);
        const ty=Math.atan2(-v.x,-v.z), tp=Math.atan2(v.y,Math.hypot(v.x,v.z));
        let dy=((ty-yaw+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI; yaw+=dy*Math.min(1,dt*5); pitch+=(tp-pitch)*Math.min(1,dt*5); }
      if(flight.home){ yaw*=1-Math.min(1,dt*5); pitch*=1-Math.min(1,dt*5); }
    }
    if(flight.t>=1) flight=null; }

  // seed point
  const fs=fade(seed,stage===0,dt,2); seed.scale.setScalar((0.4+0.15*Math.sin(t*6))*fs+0.001); seed.material.opacity=fs;

  // expanding cloud
  let R=0.05, ccol=hot.clone(), cop=0;
  if(stage===1){ const k=ease(stageT/7); R=0.05+k*28; cop=1; ccol.lerpColors(hot,warm,k*.6);
    flash.material.opacity=Math.max(0,1-stageT*1.2); flash.scale.setScalar(1+stageT*12); }
  else { flash.material.opacity=0; }
  if(stage===2){ const k=ease(stageT/5); R=28+k*4; cop=1; ccol.lerpColors(warm,cool,k); }
  if(stage===3){ R=32; cop=Math.max(0,1-stageT/3); ccol.copy(cool); }
  if(stage>=1&&stage<=3){ setCloud(R); }
  cloud.visible=cop>0.01; cloudMat.opacity=cop; cloudMat.color.copy(ccol);
  cloudMat.size= stage===1 ? 0.12+ease(stageT/7)*0.35 : 0.47;

  // atoms
  const fa=fade(atoms,stage===2&&stageT>2.5,dt,1); setOpacity(atoms,fa);
  atoms.children.forEach(a=>{ const u=a.userData; u.ring.rotation.z+=dt*2; const e=t*3+u.ph; u.el.position.set(Math.cos(e)*.2,Math.sin(e)*.2,0); a.rotation.y+=dt*.5; });

  // stars
  const fst=fade(stars,stage>=3,dt,0.6); starMat.opacity=fst*(0.85+0.15*Math.sin(t*2));
  // gas -> new star
  const onGas=stage===3; gas.visible=onGas; newStar.visible=onGas;
  if(onGas){ const k=ease(stageT/4); for(let i=0;i<GN;i++){ const r=(1-k)*2.2+0.05, a=t*.4; const x=gdir[i*3],z=gdir[i*3+2];
      gpos[i*3]=ORIGIN.x+(x*Math.cos(a)-z*Math.sin(a))*r; gpos[i*3+1]=ORIGIN.y+gdir[i*3+1]*r; gpos[i*3+2]=ORIGIN.z+(x*Math.sin(a)+z*Math.cos(a))*r; }
    gasGeo.attributes.position.needsUpdate=true; gasMat.opacity=1-k*.8;
    const s=Math.max(0,(stageT-3.2))*1.5; newStar.scale.setScalar(Math.min(s,1.6)*(1+.08*Math.sin(t*8))+0.001); }

  // galaxies
  const fg=fade(galaxies,stage>=4,dt,0.8); setOpacity(galaxies,fg);
  galaxies.children.forEach(g=>{ if(g.userData.spin) g.rotation.y+=g.userData.spin*dt; });
  if(stage===6){ galaxies.children.forEach(g=>g.position.multiplyScalar(1+dt*0.01)); }

  // solar system
  const fso=fade(solar,stage===5||stage===6,dt,1); setOpacity(solar,fso);
  const orbit=1.3, ea=t*0.5;
  let ep=new THREE.Vector3(SUN.x+Math.cos(ea)*orbit, SUN.y, SUN.z+Math.sin(ea)*orbit);
  let es=1;
  if(stage===6){ const k=ease(stageT/3); ep.lerp(new THREE.Vector3(0,1.5,-1.4),k); es=1+k*3; }
  earth.position.copy(ep); earth.scale.setScalar(es); earth.rotation.y+=dt*0.6;
  moon.position.set(ep.x+Math.cos(t*2)*0.25*es, ep.y+0.03, ep.z+Math.sin(t*2)*0.25*es);
  earthLabel.position.copy(ep).add(new THREE.Vector3(0,0.25*es,0)); earthLabel.visible=stage===5&&fso>0;
  youLabel.position.copy(ep).add(new THREE.Vector3(0,0.12*es+0.25+Math.sin(t*4)*.03,0)); youLabel.visible=stage===6&&stageT>2.5;

  // branes
  const onB=stage===7; branes.visible=onB; bum.visible=false;
  if(onB){
    const cyc=stageT%6, k=Math.min(cyc/2.5,1), gap=(1-ease(k))*2.2+0.02;
    [[braneA,-1],[braneB,1]].forEach(([m,s])=>{
      m.position.x=s*gap; const arr=m.geometry.attributes.position.array, base=m.userData.base;
      for(let i=0;i<arr.length;i+=3){ arr[i+2]=Math.sin(base[i]*2+t*2)*0.12+Math.cos(base[i+1]*2+t*1.5)*0.12; }
      m.geometry.attributes.position.needsUpdate=true; m.material.opacity= cyc>2.5 ? Math.max(0,.7-(cyc-2.5)) : .7;
    });
    if(cyc>2.5){ const f=(cyc-2.5)/3.5; flash.material.opacity=Math.max(0,1-f*1.3); flash.scale.setScalar(1+f*25); bum.visible=f<.5; }
  }

  renderer.render(scene,camera);
});

document.fonts.ready.then(()=>drawPanel(stage));
drawPanel(0);
</script>
